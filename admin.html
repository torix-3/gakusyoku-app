const datasets=JSON.parse(document.getElementById('catalog').textContent);

function rows(){const original=data().items.map(i=>({...i,...(patches[key(i.id)]||{})}));const custom=Object.entries(patches).filter(([k,v])=>k.startsWith(building+':')&&v.created&&!original.some(i=>i.id===v.id)).map(([k,v])=>v);return [...original,...custom];}
function render(){el('b2').classList.toggle('selected',building==='2');el('b13').classList.toggle('selected',building==='13');let arr=rows();const q=el('search').value.trim().toLowerCase(),f=el('filter').value;arr=arr.filter(i=>(i.name||'').toLowerCase().includes(q)||i.id.toLowerCase().includes(q)).filter(i=>f==='all'||(f==='shown'?i.visible===true:i.visible!==true));el('count').textContent=`${arr.length}件 / 全${rows().length}件（${building}号館）`;el('list').innerHTML=arr.map(i=>{const cat=data().categories.find(c=>c.id===i.category);const missing=['energy_kcal','protein_g','fat_g','carb_g','salt_g'].some(k=>i[k]==null);return `<article class="item" data-id="${esc(i.id)}"><div><b>${esc(i.name)}</b><div class="meta">${esc(i.id)} · ${esc(cat?.label||i.category)} · ${i.price==null?'価格未登録':esc(i.price)+'円'} ${missing?' · ⚠ 栄養未登録':''} ${i.deleted?' · 削除扱い':''}</div></div><div class="controls"><label><input class="toggle" type="checkbox" ${i.visible===true?'checked':''}> 表示ON</label><button class="edit" type="button">編集</button></div><div class="editor hidden"></div></article>`}).join('')||'<p>該当するメニューはありません。</p>';}
function editPanel(article){const id=article.dataset.id;const i=rows().find(x=>x.id===id);const editor=article.querySelector('.editor');if(!editor.classList.contains('hidden')){editor.classList.add('hidden');return;}editor.innerHTML=fields.map(k=>`<label class="field">${esc(({name:'商品名',price:'価格（円）',category:'カテゴリ',energy_kcal:'エネルギー kcal',protein_g:'たんぱく質 g',fat_g:'脂質 g',carb_g:'炭水化物 g',salt_g:'塩分 g'})[k])}${k==='category'?`<select name="${k}">${data().categories.map(c=>`<option value="${esc(c.id)}" ${c.id===i.category?'selected':''}>${esc(c.label)}</option>`).join('')}</select>`:`<input name="${k}" ${k==='name'?'type="text"':'type="number" step="any" min="0"'} value="${esc(i[k])}">`}</label>`).join('')+'<div><button type="button" class="primary save">変更を保存</button> <button type="button" class="delete">削除扱いにする</button></div>';editor.classList.remove('hidden');}
el('list').addEventListener('click',e=>{const article=e.target.closest('.item');if(!article)return;const id=article.dataset.id,k=key(id);if(e.target.classList.contains('edit'))editPanel(article);if(e.target.classList.contains('save')){const change={};for(const f of fields){const input=article.querySelector(`[name="${f}"]`);change[f]=f==='name'||f==='category'?input.value:(input.value===''?null:Number(input.value));}if(!change.name.trim()){alert('商品名を入力してください');return;}patches[k]={...(patches[k]||{}),...change,id};save();render();}if(e.target.classList.contains('delete')){if(confirm('この商品を削除扱いにしますか？（元データは保持）')){patches[k]={...(patches[k]||{}),id,deleted:true,visible:false};save();render();}}});

  const cb='joshoAdmin_'+Math.random().toString(36).slice(2), script=document.createElement('script');
  let ended=false;
  const end=(err,data)=>{if(ended)return;ended=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)};
  const timer=setTimeout(()=>end(new Error('読み込みタイムアウト')),12000);
  window[cb]=data=>end(null,data);
  script.onerror=()=>end(new Error('通信失敗'));
  script.src=syncUrl+(syncUrl.includes('?')?'&':'?')+'action=read&callback='+cb+'&_='+Date.now();
  document.head.appendChild(script);
 });
}
el('loadCloud').onclick=async()=>{
 try { const r=await cloudRead();if(!r.ok)throw Error(r.error||'取得失敗');
 if(!confirm('共有設定でこのブラウザの編集内容を上書きしますか？'))return;
 patches=r.patches||{};save();render();state.textContent='共有設定を取得しました。';
 }catch(e){state.textContent='取得失敗：'+e.message;}
};
el('publishCloud').onclick=async()=>{
 if(!syncUrl){alert('先にGAS URLを設定してください');return;}
 const key=el('publishKey').value;
 if(!key){alert('管理者用の公開キーを入力してください');return;}
 if(!confirm('このブラウザの全メニュー設定を全学生向けに公開しますか？'))return;
 state.textContent='公開処理中…';
 try {
  // text/plain はプリフライト不要。GASのリダイレクトにより応答は読めない場合があるため、再取得して照合する。
  await fetch(syncUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'publish',key,patches})});
  await new Promise(r=>setTimeout(r,1500));
  const cloud=await cloudRead();
  if(!cloud.ok)throw Error(cloud.error||'取得失敗');
  if(JSON.stringify(cloud.patches||{})!==JSON.stringify(patches))throw Error('公開内容を確認できません。キーやGASのデプロイ設定を確認してください。');
  state.textContent='公開を確認しました。学生側で再読み込みすると反映されます。';
 }catch(e){state.textContent='公開を確認できません：'+e.message;}
};
</script></body></html>
